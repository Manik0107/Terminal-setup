# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
# Ghostty reports TERM=xterm-ghostty, which the two overrides above never match.
# usstyle buys undercurl/coloured underlines in nvim diagnostics; Windows
# Terminal cannot render those at all.
set -as terminal-features ",xterm-ghostty:RGB,xterm-ghostty:usstyle,xterm-ghostty:hyperlinks"
# Let nvim tell C-i from Tab, S-Enter from Enter, etc. Only sent when the
# running app actually asks for CSI u, so it is inert elsewhere.
set -s extended-keys on
# Route yanks to the Windows clipboard over OSC 52 — there is no wl-copy,
# xclip or win32yank in this WSL, so this is the only path that works.
set -g set-clipboard on

# zsh lives in a different place on every platform: /usr/bin/zsh on Debian,
# /bin/zsh on stock macOS, $(brew --prefix)/bin/zsh when Homebrew's newer zsh
# is installed. tmux cannot expand $(command -v zsh) in an option value, so
# probe with if-shell and prefer Homebrew's build when it exists.
# Least-preferred first; each if-shell that matches overwrites the previous.
# if-shell without -b runs synchronously inside a config file, so this order
# holds. Homebrew's zsh wins when present, stock macOS /bin/zsh is the floor.
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh ; set -g default-command /usr/bin/zsh'
if-shell '[ -x /usr/local/bin/zsh ]' 'set -g default-shell /usr/local/bin/zsh ; set -g default-command /usr/local/bin/zsh'
if-shell '[ -x /opt/homebrew/bin/zsh ]' 'set -g default-shell /opt/homebrew/bin/zsh ; set -g default-command /opt/homebrew/bin/zsh'

# Use Ctrl+a as the tmux prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g allow-passthrough on

# Background: force dark inside tmux instead of inheriting the terminal's
set -g window-style "bg=#0a0a0a"
set -g window-active-style "bg=#0a0a0a"

# Status bar
set -g status-position top
set -g status-style bg=#0a0a0a,fg=white
set -g status-justify left
set -g status-interval 1
set -g status-left "#[fg=cyan,bold] 󰊪  #[fg=white]│ "
set -g status-left-length 30
set -g status-right "#[fg=cyan,bold]󰃭 %b %d #[fg=brightblack]│ #[fg=cyan,bold]󰥔 %H:%M "
set -g status-right-length 60
setw -g window-status-separator " | "
setw -g window-status-format "#[fg=brightblack]#I #[fg=white]#W#[fg=yellow]#{?window_zoomed_flag, 󰊓,}"
setw -g window-status-current-format "#[fg=cyan,bold]#I #[fg=cyan]#W#[fg=yellow]#{?window_zoomed_flag, 󰊓,}"

# Window and pane behavior
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=cyan,bold
set -g display-panes-time 2000

# QoL
set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on
setw -g mode-keys vi

# Key bindings
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Navigate panes with Ctrl+h/j/k/l (no prefix).
# If the pane is running vim/nvim, forward the key so nvim moves between its
# own splits (e.g. code -> explorer); otherwise move the tmux pane.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Escape hatch: prefix + C-l still clears the screen inside a shell pane
bind C-l send-keys "C-l"
# Resize panes (requires prefix)
bind -r h resize-pane -L 3
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3

# Toggle zoom (maximize/restore) current pane
bind m resize-pane -Z

bind c new-window -c "#{pane_current_path}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# TPM + plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
run "~/.tmux/plugins/tpm/tpm"
